spring.application.name=smartparking
server.port=8080


# ==========================================
# Railway Remote MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:tokaido.proxy.rlwy.net}:${DB_PORT:56938}/${DB_NAME:parking_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:t}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Change cors.allowed-origins to cors.allowed.origins
# ==========================================
# JWT Security Settings
# ==========================================
jwt.secret=${JWT_SECRET:mmtc-smartparking-secret204-very-long-key}
jwt.expiration=${JWT_EXPIRATION:86400000}
# In application.properties (or application.yml)
groq.model=llama-3.3-70b-versatile
# ==========================================
# Mail Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:s}
spring.mail.password=${MAIL_PASSWORD:yjz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# PayHere Payment Gateway
# ==========================================
payhere.merchant.id=${PAYHERE_MERCHANT_ID:}
payhere.merchant.secret=${PAYHERE_MERCHANT_SECRET:}
payhere.return.url=${PAYHERE_RETURN_URL:https://smartpark-reservation-frontend.vercel.app/slots/confirmation}
payhere.cancel.url=${PAYHERE_CANCEL_URL:https://smartpark-reservation-frontend.vercel.app/slots/payment-cancelled}
payhere.notify.url=${PAYHERE_NOTIFY_URL:https://smartpark-reservation-backend-production.up.railway.app/api/payments/payhere/notify}

# ==========================================
# Third-Party Integrations
# ==========================================
groq.api.key=${GROQ_API_KEY:gs}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://smartpark-reservation-frontend.vercel.app,http://localhost:3000}
firebase.database.url=${FIREBASE_DATABASE_URL:https://smart-parkride-system-default-rtdb.asia-southeast1.firebasedatabase.app}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
