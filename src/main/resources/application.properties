spring.application.name=smartparking
server.port=8080


# ==========================================
# Railway Remote MySQL Database Configuration
# ==========================================
spring.datasource.url=${DB_HOST}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Change cors.allowed-origins to cors.allowed.origins
# ==========================================
# JWT Security Settings
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
# In application.properties (or application.yml)
groq.model=${GROQ_MODEL}
# ==========================================
# Mail Configuration
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# PayHere Payment Gateway
# ==========================================
payhere.merchant.id=${PAYHERE_MERCHANT_ID}
payhere.merchant.secret=${PAYHERE_MERCHANT_SECRET}
payhere.return.url=${PAYHERE_RETURN_URL}
payhere.cancel.url=${PAYHERE_CANCEL_URL}
payhere.notify.url=${PAYHERE_NOTIFY_URL}

# ==========================================
# Third-Party Integrations
# ==========================================
groq.api.key=${GROQ_API_KEY}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}
firebase.database.url=${FIREBASE_DATABASE_URL}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64}
app.frontend.base-url=${FRONTEND_BASE_URL}
